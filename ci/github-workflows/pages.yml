name: pages

# Builds the public site, dashboard demo, product profile demo, and—only when
# explicitly committed—the maintainer's sanitized production profile.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "scripts/gendemo/**"
      - "scripts/genprofiledemo/**"
      - "scripts/profile_pages.py"
      - "docs/media/public-profile-demo/**"
      - "public-profile/**"
      - "profile-e2e/**"
      - "profile-paper/**"
      - "internal/profilewebembed/**"
      - "ci/github-workflows/pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep candidate builds out of the production deployment queue.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    # The locked Playwright version supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/heads/main' || github.sha }}

      - name: Record the assembled revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            profile-e2e/package-lock.json
            profile-paper/package-lock.json

      - name: Test and build the dashboard demo
        working-directory: web
        run: |
          npm ci
          npm test
          VITE_DEMO=1 npm run build

      - name: Rebuild and verify the self-hosted D4 newspaper engine
        working-directory: profile-paper
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../internal/profilewebembed/static/assets/paper-3d.js ../internal/profilewebembed/static/assets/paper.js

      - name: Test the public profile in Chromium, Firefox and WebKit
        working-directory: profile-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm test

      - name: Assemble the Pages tree
        run: |
          mkdir -p _pages/demo _pages/profile-demo
          cp -R site/. _pages/
          cp -R web/dist/. _pages/demo/
          # SPA fallback: deep links under /demo/ must serve the app shell.
          cp web/dist/index.html _pages/404.html
          # Product demo and maintainer profile are deliberately separate.
          cp -R docs/media/public-profile-demo/. _pages/profile-demo/
          if [ -f public-profile/profile.json ]; then
            jq -e '.provenance.kind == "local_sanitized_snapshot" and .provenance.refresh_mode == "manual_publish" and .provenance.live_sync == false' public-profile/profile.json >/dev/null
            jq -e '.provenance == "local_sanitized_snapshot"' public-profile/manifest.json >/dev/null
            test "$(jq -r .snapshot_id public-profile/profile.json)" = "$(jq -r .snapshot_id public-profile/manifest.json)"
            mkdir -p _pages/profile
            cp -R public-profile/. _pages/profile/
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.revision }}

      - name: Check for a superseding fallback
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          git diff --exit-code HEAD FETCH_HEAD -- public-profile

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed snapshot and preview identities
        if: success()
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -f public-profile/profile.json ]; then
            python3 scripts/profile_pages.py --dir public-profile \
              --url "${PAGES_URL%/}/profile" --attempts 5
          fi
