name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: wheretoken
          MYSQL_ROOT_PASSWORD: wttest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwttest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WHERETOKEN_MYSQL_TEST_DSN: root:wttest@tcp(127.0.0.1:3306)/wheretoken?parseTime=true&charset=utf8mb4
      WHERETOKEN_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            profile-e2e/package-lock.json

      - name: Dependency metadata
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Go quality gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Web quality gate
        working-directory: web
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Hosted production artifact
        run: bash scripts/build-hosted.sh "$RUNNER_TEMP/wheretoken-hosted"

      - name: Public profile browser gate
        working-directory: profile-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm test

      - name: CLI fixture
        run: bash scripts/verify-cli.sh

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Apple signing is skip-if-missing. Create Repository secrets with these
      # exact names (values in GitHub UI only — never paste them into chat):
      #   MACOS_SIGN_P12            Developer ID Application .p12, base64
      #   MACOS_SIGN_PASSWORD       password for that .p12
      #   MACOS_NOTARY_KEY          App Store Connect API .p8, base64
      #   MACOS_NOTARY_KEY_ID       key id (also in AuthKey_*.p8 filename)
      #   MACOS_NOTARY_ISSUER_ID    issuer UUID from App Store Connect
      # See docs/macos-signing.md. Windows Authenticode is not wired yet.
      - name: Enable Apple signing when secrets exist
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$MACOS_SIGN_P12" ] && [ -n "$MACOS_SIGN_PASSWORD" ] && [ -n "$MACOS_NOTARY_KEY" ] && [ -n "$MACOS_NOTARY_KEY_ID" ] && [ -n "$MACOS_NOTARY_ISSUER_ID" ]; then
            {
              printf 'MACOS_SIGN_P12<<EOF\n%s\nEOF\n' "$MACOS_SIGN_P12"
              printf 'MACOS_SIGN_PASSWORD<<EOF\n%s\nEOF\n' "$MACOS_SIGN_PASSWORD"
              printf 'MACOS_NOTARY_KEY<<EOF\n%s\nEOF\n' "$MACOS_NOTARY_KEY"
              printf 'MACOS_NOTARY_KEY_ID<<EOF\n%s\nEOF\n' "$MACOS_NOTARY_KEY_ID"
              printf 'MACOS_NOTARY_ISSUER_ID<<EOF\n%s\nEOF\n' "$MACOS_NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Apple signing secrets present; goreleaser will sign and notarize macOS binaries."
          else
            echo "Apple signing secrets absent or incomplete; publishing unsigned binaries."
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
