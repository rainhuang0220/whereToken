<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="fiber" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72 0.46" numOctaves="3" seed="5147" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.68" intercept="0.18"/>
        <feFuncG type="linear" slope="0.68" intercept="0.18"/>
        <feFuncB type="linear" slope="0.68" intercept="0.18"/>
      </feComponentTransfer>
    </filter>
    <filter id="surface" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="2" seed="271"/>
      <feGaussianBlur stdDeviation="18"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="soft-shadow" cx="18%" cy="12%" r="82%">
      <stop offset="0" stop-color="#111820" stop-opacity="0.018"/>
      <stop offset="0.58" stop-color="#111820" stop-opacity="0.006"/>
      <stop offset="1" stop-color="#111820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft-light" cx="82%" cy="74%" r="68%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.56"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#soft-shadow)"/>
  <rect width="1024" height="1024" fill="url(#soft-light)"/>
  <rect width="1024" height="1024" filter="url(#surface)" opacity="0.018" style="mix-blend-mode:multiply"/>
  <rect width="1024" height="1024" filter="url(#fiber)" opacity="0.064" style="mix-blend-mode:multiply"/>
</svg>
