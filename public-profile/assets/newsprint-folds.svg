    <linearGradient id="vertical-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="0.13" stop-color="#fff" stop-opacity="0.72"/>
      <stop offset="0.43" stop-color="#fff" stop-opacity="0.46"/>
