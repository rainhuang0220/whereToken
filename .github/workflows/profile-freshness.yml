name: profile-freshness

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Public wall verified age
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 \
            -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/wall.json" \
            'https://wheretoken.plainlist.space/api/v1/public-profile/rainhuang0220'
          python3 - "$RUNNER_TEMP/wall.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          env = json.load(open(sys.argv[1], encoding="utf-8"))
          wall = env.get("wall") or {}
          verified = wall.get("verified_at") or ""
          phase = wall.get("phase") or ""
          if not verified:
              raise SystemExit("public wall has no verified_at")
          stamp = datetime.fromisoformat(verified.replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - stamp
          hours = age.total_seconds() / 3600
          print(f"verified_at={verified} phase={phase} age_hours={hours:.1f}")
          if age.total_seconds() > 36 * 3600:
              raise SystemExit(f"public wall has not verified since {verified} (phase={phase})")
          PY
