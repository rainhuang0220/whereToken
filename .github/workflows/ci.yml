name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go race (not Windows)
        if: runner.os != 'Windows'
        run: go test -race ./internal/cli ./internal/table ./internal/report ./internal/metric ./internal/fuzzy ./internal/vendor

      - name: Go build
        shell: bash
        run: |
          out=wheretoken
          if [ "${{ runner.os }}" = "Windows" ]; then out=wheretoken.exe; fi
          go build -o "$out" ./cmd/wheretoken

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web tests
        working-directory: web
        run: npm ci && npm test

      - name: npm wrapper tests
        working-directory: npm
        env:
          WHERETOKEN_SKIP_DOWNLOAD: "1"
        run: npm test

      - name: CLI fixture (not Windows bash-only)
        if: runner.os != 'Windows'
        run: bash scripts/verify-cli.sh

      - name: govulncheck
        if: runner.os == 'Linux'
        run: bash scripts/govulncheck.sh
