name: pages

# Builds the public site: site/ landing + the dashboard in demo mode
# (VITE_DEMO=1, committed sample payloads, no backend) → GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "scripts/gendemo/**"
      - "ci/github-workflows/pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the dashboard demo
        working-directory: web
        run: |
          npm ci
          npm test
          VITE_DEMO=1 npm run build

      - name: Assemble the Pages tree
        run: |
          mkdir -p _pages/demo
          cp -R site/. _pages/
          cp -R web/dist/. _pages/demo/
          # SPA fallback: deep links under /demo/ must serve the app shell.
          cp web/dist/index.html _pages/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
