name: upgrade-candidate

on:
  pull_request:

permissions:
  contents: read

jobs:
  update:
    name: update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.10"
      - name: native update from v0.7.18 to the candidate
        shell: bash
        run: bash scripts/candidate-upgrade.sh
