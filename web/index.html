<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whereToken</title>
    <script>
      (function () {
        var allowed = ['kiln', 'moss', 'porcelain', 'jiang', 'day', 'ink', 'cartoon', 'ledger']
        var id = 'kiln'
        try {
          var raw = localStorage.getItem('wheretoken.theme')
          if (allowed.indexOf(raw) !== -1) id = raw
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', id)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Big+Shoulders+Display:wght@800&family=Chiron+Hei+HK:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Martian+Mono:wght@400;600&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
