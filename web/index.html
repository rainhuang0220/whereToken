<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whereToken</title>
    <script>
      (function () {
        var allowed = ['kiln', 'moss', 'porcelain', 'jiang', 'day', 'ink', 'cartoon', 'ledger']
        var id = 'kiln'
        try {
          var raw = localStorage.getItem('wheretoken.theme')
          if (allowed.indexOf(raw) !== -1) id = raw
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', id)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
