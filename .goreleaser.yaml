# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: wheretoken

before:
  hooks:
    - go mod tidy

builds:
  - id: wheretoken
    main: ./cmd/wheretoken
    binary: wheretoken
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
