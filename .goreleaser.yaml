# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: wheretoken

before:
  hooks:
    - go mod tidy
    - sh -c "cd web && npm ci && npm run build && rm -rf ../internal/webembed/dist && mkdir -p ../internal/webembed/dist && cp -R dist/. ../internal/webembed/dist/"

builds:
  - id: wheretoken
    main: ./cmd/wheretoken
    binary: wheretoken
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/cli-json.schema.json
      - docs/wheretoken.1
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# macOS signing/notarization is skip-if-missing.
# GitHub Actions secrets (values only in the GitHub UI; never commit them):
#   MACOS_SIGN_P12, MACOS_SIGN_PASSWORD,
#   MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
# See docs/macos-signing.md. Windows Authenticode is not wired.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - wheretoken
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

release:
  name_template: "{{.Tag}}"
  mode: keep-existing

nfpms:
  - id: default
    maintainer: rainhuang0220 <iamrainhuang@163.com>
    description: Local coding-agent token usage as a character table
    homepage: https://github.com/rainhuang0220/whereToken
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: docs/wheretoken.1
        dst: /usr/share/man/man1/wheretoken.1
      - src: completions/wheretoken.bash
        dst: /usr/share/bash-completion/completions/wheretoken
      - src: completions/_wheretoken
        dst: /usr/share/zsh/site-functions/_wheretoken
      - src: completions/wheretoken.fish
        dst: /usr/share/fish/vendor_completions.d/wheretoken.fish

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
